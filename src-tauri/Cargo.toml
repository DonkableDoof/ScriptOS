[package]
name = "scriptos"
version = "1.12.1"
description = "ScriptOS"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
ureq = "3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
